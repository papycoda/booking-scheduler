services:
  - type: web
    name: bookie-papycoda-api
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend python -m alembic -c backend/alembic.ini upgrade head && PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_ADMIN_EMAILS
        value: ""
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookie-papycoda-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bookie-papycoda-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false

  - type: web
    name: bookie-papycoda-web
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  - type: keyvalue
    name: bookie-papycoda-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: bookie-papycoda-postgres
    databaseName: booking_scheduler
    user: booking_scheduler
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []
