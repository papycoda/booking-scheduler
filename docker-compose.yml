services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: booking_scheduler
      POSTGRES_USER: booking_scheduler
      POSTGRES_PASSWORD: booking_scheduler
    ports:
      - "5433:5432"
    volumes:
      - booking_scheduler_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_scheduler -d booking_scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://booking_scheduler:booking_scheduler@postgres:5432/booking_scheduler
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production-minimum-32-characters
      - FRONTEND_URL=http://localhost:3000
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - DEMO_MODE=true
      - DEMO_ADMIN_EMAILS=${DEMO_ADMIN_EMAILS:-demo@example.com}
    volumes:
      - ./backend:/app
    command:
      - sh
      - -c
      - python -m alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy

volumes:
  booking_scheduler_postgres:
